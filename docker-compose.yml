# MySQL енді қажет емес: деректер Firebase Firestore-да. Кілт: ./serviceAccountKey.json
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FIREBASE_KEY_FILE: /run/secrets/firebase_key
    secrets:
      - firebase_key
    ports:
      - "${APP_PORT:-3000}:3000"

secrets:
  firebase_key:
    file: ./serviceAccountKey.json
